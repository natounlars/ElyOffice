jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, package and upload for Linux
        shell: bash
        env:
          ELY_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELY_MICROSOFT_CLIENT_ID: ${{ secrets.ELY_MICROSOFT_CLIENT_ID }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v*) ;; *) echo "TAG must start with 'v'"; exit 1;; esac
          ELY_SHARE="$RUNNER_TEMP/ely-share" "$PWD/scripts/ci.sh" linux "$TAG"
